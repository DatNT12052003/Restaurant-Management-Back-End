name: CI

on:
    pull_request:
    push:
        branches: [develop, main]

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: postgres
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            NODE_ENV: test
            DB_HOST: localhost
            DB_PORT: 5432
            DB_USER: postgres
            DB_PASSWORD: postgres
            DB_NAME: restaurant_management_test
            RATE_LIMIT_DISABLED: "true"
            # Chỉ dùng cho test, không phải bí mật thật
            ACCESS_SECRET: ci-access-secret
            REFRESH_SECRET: ci-refresh-secret
            RESET_PASSWORD_SECRET: ci-reset-secret
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm test
            - run: npm run build
